apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.sahheh.app'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.sahheh.app"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
